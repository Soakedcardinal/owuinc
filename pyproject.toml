[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owuinc"
version = "3.7.3"
description = "Manage files, tasks, and calendars via WebDAV and CalDAV."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

# what the plugin runs on
dependencies = [
    "caldav>=3.0.0",
    "icalendar",
    "aiowebdav2",
    "pydantic",
    "tiktoken",
    "aiohttp",
    "python-dateutil",
]

# only for you
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pre-commit",
    "radicale",
    "wsgidav",
    "cheroot",
]

[tool.setuptools.packages.find]
include = ["owuinc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -rA"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
strict_config = true
strict_markers = true
