repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        # vulture_whitelist.py is vulture data (bare name references), not code
        exclude: vulture_whitelist\.py

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: uv run vulture owuinc/owuinc.py startup_context_injector.py vulture_whitelist.py
        language: system
        pass_filenames: false
